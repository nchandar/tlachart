version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint has no TS 7 support yet, so lint fails; revisit when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
