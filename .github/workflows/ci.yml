name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # The jar is pinned with the same sha256 as src/tlc/locate.ts, so CI runs a known TLC.
      TLA2TOOLS: ${{ github.workspace }}/tla2tools.jar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLC 1.7.4
        run: |
          curl -fsSLo tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run model
      - run: bun run model:variants
